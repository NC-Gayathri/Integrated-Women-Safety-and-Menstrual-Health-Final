name: TEMP NAARI weak-contact regression patcher

on:
  push:
    branches:
      - fix/naari-kavach-weak-contact-vitals

permissions:
  contents: write

jobs:
  patch-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/naari-kavach-weak-contact-vitals
          fetch-depth: 0
      - name: Add physical weak-contact regression only
        shell: python
        run: |
          from pathlib import Path

          cpp = Path('tests/naari_optical/vitals_test.cpp')
          text = cpp.read_text()
          needle = '''    } else if (name == "buffered_pulse") {\n'''
          insert = '''    } else if (name == "weak_contact_noise") {\n      // Physical 5 Oct capture after contact degraded: raw channels remained just\n      // above the old contact gate (~3-5k) and small optical ripple was enough\n      // to produce partial HR events. That weak-contact region must never mature\n      // into a numeric vital.\n      for (int i = 0; i < 1600; ++i) {\n        delay(10);\n        const double wave = sin(2.0 * 3.141592653589793 * i / 80);\n        processOpticalSample(3500, static_cast<uint32_t>(3900 + 120 * wave));\n      }\n      require(!heartRateValid && !spo2Valid,\n              "weak-contact optical ripple must not become a vital estimate");\n      report();\n      noNumbers();\n    } else if (name == "buffered_pulse") {\n'''
          if needle not in text:
              raise SystemExit('vitals insertion point not found')
          cpp.write_text(text.replace(needle, insert, 1))

          py = Path('scripts/test_naari_vitals_behavior.py')
          text = py.read_text()
          needle = "    'clean_pulse', 'low_amplitude_pulse', 'buffered_pulse', 'too_fast_pulse',\n"
          repl = "    'clean_pulse', 'low_amplitude_pulse', 'weak_contact_noise', 'buffered_pulse', 'too_fast_pulse',\n"
          if needle not in text:
              raise SystemExit('case-list insertion point not found')
          py.write_text(text.replace(needle, repl, 1))

          Path('.github/workflows/tmp-naari-add-weak-contact-regression.yml').unlink()
      - name: Commit RED regression
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/naari_optical/vitals_test.cpp scripts/test_naari_vitals_behavior.py .github/workflows/tmp-naari-add-weak-contact-regression.yml
          git commit -m "RED: reproduce weak-contact heart-rate leakage"
          git push origin HEAD:fix/naari-kavach-weak-contact-vitals
