name: NAARI KAVACH Closure Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches:
      - master
      - main
    paths:
      - "esp32-firmware/naari_kavach_dual_sensor_ble_test/**"
      - "esp32-firmware/max30102_light_probe/**"
      - "esp32-firmware/naari_sensor_triage/**"
      - "services/BleService.ts"
      - "app/(tabs)/safety.tsx"
      - "app/(tabs)/_layout.tsx"
      - "hooks/useIoTEmergencyListener.ts"
      - "components/IoTEmergencyModal.tsx"
      - "services/EmergencyContacts.ts"
      - "android/**"
      - "ble-bridge/*.ps1"
      - "scripts/test_naari_*.py"
      - "scripts/test_naari_*.cjs"
      - ".github/scripts/**"
      - "tests/naari_optical/**"
      - "formal-verification-and-mathematical-proofs/**"
      - "README.md"
      - "documentation/NAARI_KAVACH_SHARED_BUS_DIAGNOSIS_V13.md"
      - "documentation/NAARI_KAVACH_V16_FALL_PULSE_ACCEPTANCE.md"
      - "documentation/NAARI_KAVACH_V17_RECURRENCE_DIAGNOSIS.md"
      - "tsconfig.naari-ci.json"
      - "documentation/NAARI_KAVACH_DUAL_SENSOR_BLE_TEST_PLAN.md"
      - "documentation/NAARI_KAVACH_OPTICAL_READY_REPAIR.md"
      - "documentation/NAARI_KAVACH_V24_SENSOR_LED_RECURRENCE.md"
      - "documentation/NAARI_KAVACH_V25_HARDWARE_TRIAGE.md"
      - "documentation/NAARI_KAVACH_ESP32_UPLOAD_RECOVERY.md"
      - "documentation/NAARI_KAVACH_VITALS_ACQUISITION.md"
      - "documentation/NAARI_KAVACH_I2C_RECOVERY.md"
      - "documentation/NAARI_KAVACH_SIGNAL_SETTLING.md"
      - "esp32-firmware/README.md"
      - ".github/workflows/naari-kavach-closure.yml"
      - ".github/workflows/naari-upload-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naari-kavach-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-contract:
    name: Firmware contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regress optical READY handshake
        run: python3 scripts/test_naari_optical_readiness.py

      - name: Execute optical fault and SOS regressions
        run: python3 scripts/test_naari_optical_behavior.py

      - name: Execute 30-second sensor triage real-source regressions
        run: python3 scripts/test_naari_sensor_triage.py

      - name: Exercise app-wide physical BLE SOS and offline contact policies
        run: node scripts/test_naari_global_sos.cjs

      - name: Execute sampled-signal and stale-reading regressions
        run: python3 scripts/test_naari_vitals_behavior.py

      - name: Verify fail-closed BLE gateway and real-device diagnostic policy
        run: python3 scripts/test_naari_gateway_policy.py

      - name: Parse Windows PowerShell physical serial diagnostic script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './ble-bridge/read_com5.ps1').Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw 'Physical serial diagnostic PowerShell failed to parse.'
          }

      - name: Verify physical isolation matches actual error codes
        shell: pwsh
        run: ./scripts/test_naari_serial_isolation.ps1

      - name: Prove cleanup preserves concurrent branch updates
        run: python3 scripts/test_naari_branch_cleanup.py

      - name: Verify physical upload recovery contract
        run: python3 scripts/test_naari_upload_recovery.py

      - name: Enforce hardware and BLE invariants
        shell: bash
        run: |
          set -euo pipefail
          F="esp32-firmware/naari_kavach_dual_sensor_ble_test/naari_kavach_dual_sensor_ble_test.ino"

          test -f "$F"
          grep -Fq '#define DEVICE_NAME         "NAARI_KAVACH"' "$F"
          grep -Fq '#define SERVICE_UUID        "12345678-1234-1234-1234-1234567890ab"' "$F"
          grep -Fq '#define CHARACTERISTIC_UUID "87654321-4321-4321-4321-ba0987654321"' "$F"
          grep -Fq '#define PIN_BUTTON 4' "$F"
          grep -Fq '#define PIN_LED    2' "$F"
          grep -Fq '#define I2C_SDA 21' "$F"
          grep -Fq '#define I2C_SCL 22' "$F"
          grep -Fq '#define I2C_CLOCK_HZ 100000' "$F"
          grep -Fq '#define MAX3010X_ADDR 0x57' "$F"
          grep -Fq 'part == 0x11' "$F"
          grep -Fq 'part == 0x15' "$F"
          grep -Fq 'sendBleEvent("SOS")' "$F"
          grep -Fq 'HEART_RATE:' "$F"
          grep -Fq 'SPO2:' "$F"
          grep -Fq 'VITALS:NO_VALID_READING' "$F"
          grep -Fq 'Wire.setTimeOut(I2C_TIMEOUT_MS)' "$F"
          grep -Fq '#define BLE_MTU             64' "$F"
          grep -Fq 'BLEDevice::setMTU(BLE_MTU)' "$F"
          grep -Fq 'sendSensorHealthSnapshot();' "$F"
          grep -Fq '[FIRMWARE] shared-bus-diagnostic-v13-20261010' "$F"
          grep -Fq '[ALGORITHM] fall-pulse-confidence-v16-20261010' "$F"
          grep -Fq '[BUS_POLICY] failclosed-recurrence-v17-20261011' "$F"
          grep -Fq '[FIFO_POLICY] optical-poll-vitals-v18-20261011' "$F"
          grep -Fq '[I2C_POLICY] contiguous-fifo-metadata-v19-20261012' "$F"

          grep -Fq '[CONTACT_POLICY] qualified-contact-v21-20261014' "$F"
          grep -Fq '[EVIDENCE_POLICY] pulse-and-fall-diags-v22-20261014' "$F"
          grep -Fq '[DIAGNOSTIC_POLICY] probe-and-led-evidence-v24-20261017' "$F"

          B="services/BleService.ts"
          grep -Fq "await connected.requestMTU(64)" "$B"
          grep -Fq "sUuid !== this.targetServiceUUID" "$B"
          grep -Fq "cUuid === this.targetCharUUID && isNotifiable" "$B"
          grep -Fq "devName.toLowerCase() === this.targetDeviceName.toLowerCase()" "$B"

          if grep -Eq '#include[[:space:]]*<WiFi|HTTPClient|WiFiClient' "$F"; then
            echo "Wi-Fi/HTTP code found in BLE-only firmware"
            exit 1
          fi

          if grep -Eq 'random\(|Math\.random|currentBpm[[:space:]]*=[[:space:]]*75' "$F"; then
            echo "Synthetic vital-sign source found"
            exit 1
          fi

          echo "Firmware contract PASS"

  formal-smt:
    name: Mathematical SMT safety abstraction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned SMT solver
        run: python -m pip install --disable-pip-version-check -r formal-verification-and-mathematical-proofs/requirements.txt

      - name: Check exact 32-bit fall safety abstraction and SOS invariant
        run: python "formal-verification-and-mathematical-proofs/prove_naari.py"

      - name: Prove shared I2C controller recovery fail-closed and cooldown guards
        run: python "formal-verification-and-mathematical-proofs/prove_i2c_recovery.py"

      - name: Prove 8 additional v16 multi-beat pulse confidence properties
        run: python "formal-verification-and-mathematical-proofs/prove_pulse_confidence.py"

      - name: Prove v17 failed-controller I2C exclusion and bounded restart escalation
        run: python "formal-verification-and-mathematical-proofs/prove_bus_failclosed.py"

      - name: Prove v24 register-evidence and missing-hardware gate model
        run: python "formal-verification-and-mathematical-proofs/prove_sensor_light_evidence.py"

      - name: Prove v25 source-linked diagnostic evidence gate obligations
        run: python "formal-verification-and-mathematical-proofs/prove_sensor_triage.py"

      - name: Prove v26 SOS-to-foreground-app alert policy
        run: python "formal-verification-and-mathematical-proofs/prove_global_sos.py"

      - name: Prove complete 24-property GitHub LaTeX dossier and path integrity
        run: python "formal-verification-and-mathematical-proofs/check_proof_documentation.py"

      - name: Audit repository-wide GitHub mathematical notation and negative controls
        run: python "formal-verification-and-mathematical-proofs/validate_repository_math.py"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned MathJax parser outside application dependencies
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/naari-mathjax" mathjax-full@3.2.2

      - name: Render-parse every repository mathematical expression
        env:
          NODE_PATH: ${{ runner.temp }}/naari-mathjax/node_modules
        run: node "formal-verification-and-mathematical-proofs/check_mathjax_render.cjs"

  firmware-compile:
    name: ESP32 compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install ESP32 Arduino core
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Compile DOIT ESP32 DEVKIT V1 firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/naari-kavach
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --output-dir build/naari-kavach \
            esp32-firmware/naari_kavach_dual_sensor_ble_test

      - name: Compile isolated MAX30102 emitter and low-speed I2C diagnostic
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --output-dir build/naari-kavach-light-probe \
            esp32-firmware/max30102_light_probe

      - name: Compile dedicated MPU and MAX30102 optical FIFO triage
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32doit-devkit-v1 \
            --output-dir build/naari-v25-triage \
            esp32-firmware/naari_sensor_triage

      - name: Record exact-source V25 diagnostic checksums
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > build/naari-v25-triage/SOURCE_COMMIT.txt
          printf '%s\n' 'DIAGNOSTIC ONLY: temporarily disables BLE/SOS; reflash production firmware' > build/naari-v25-triage/DO_NOT_WEAR.txt
          (cd build/naari-v25-triage && sha256sum *.bin > SHA256SUMS)

      - name: Preserve independent diagnostic firmware binary (NOT FOR WEAR)
        uses: actions/upload-artifact@v4
        with:
          name: naari-v25-triage-not-for-wear
          path: build/naari-v25-triage/*
          if-no-files-found: error

      - name: Record firmware source and checksums
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > build/naari-kavach/SOURCE_COMMIT.txt
          printf '%s\n' 'esp32:esp32@3.3.12 / esp32doit-devkit-v1' > build/naari-kavach/BOARD.txt
          cd build/naari-kavach
          sha256sum *.bin > SHA256SUMS

      - name: Preserve flashable firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: naari-kavach-esp32-firmware
          path: build/naari-kavach/*
          if-no-files-found: error

  app-static:
    name: App TypeScript and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed app integration
        run: npx eslint "services/BleService.ts" "app/(tabs)/safety.tsx"

      - name: TypeScript check
        run: npx tsc --noEmit -p tsconfig.naari-ci.json

      - name: Verify BLE vitals invalidation and SOS behavior
        run: node scripts/test_naari_ble_vitals.cjs

  android-native:
    name: Android native BLE build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Preserve Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naari-kavach-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  delete-merged-repair-branch:
    name: Delete merged repair branch
    needs: [firmware-contract, firmware-compile, app-static, android-native, formal-smt]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify merged NAARI repair branch
        id: verify
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const { data: base } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${defaultBranch}`
            });
            if (base.object.sha !== context.sha) {
              throw new Error('Default branch moved; refuse stale cleanup.');
            }

            const { data: associated } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha
            });
            const candidates = associated.filter(pr =>
              pr.merged_at &&
              pr.merge_commit_sha === context.sha &&
              pr.base.ref === defaultBranch &&
              pr.head.repo?.full_name === `${owner}/${repo}` &&
              (pr.head.ref.startsWith('fix/naari-kavach-') ||
               pr.head.ref === 'fix/naari-formal-assurance-v12' ||
               pr.head.ref === 'fix/naari-github-math-render-v15' ||
               pr.head.ref === 'fix/naari-recurrent-i2c-failclosed-v17' ||
               pr.head.ref === 'fix/naari-optical-poll-and-vitals-events-v18' ||
               pr.head.ref === 'fix/naari-v25-evidence-based-physical-triage')
            );

            if (candidates.length === 0) {
              core.info('No merged NAARI repair PR is associated with this push; nothing to delete.');
              return '';
            }
            if (candidates.length !== 1) {
              throw new Error(`Expected exactly one merged NAARI repair PR; found ${candidates.length}.`);
            }

            const pr = candidates[0];
            const repairBranch = pr.head.ref;
            let head;
            try {
              ({ data: head } = await github.rest.git.getRef({
                owner, repo, ref: `heads/${repairBranch}`
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info('Verified repair branch already deleted.');
                return '';
              }
              throw error;
            }

            if (head.object.sha !== pr.head.sha) {
              throw new Error('Repair branch moved; preserve new work.');
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${head.object.sha}...${base.object.sha}`
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Repair head is not contained in the verified default branch.');
            }

            core.setOutput('branch', repairBranch);
            return head.object.sha;

      - name: Delete with an atomic expected-head lease
        if: steps.verify.outputs.result != ''
        env:
          REPAIR_BRANCH: ${{ steps.verify.outputs.branch }}
          REPAIR_HEAD: ${{ steps.verify.outputs.result }}
        run: bash .github/scripts/delete-verified-repair-branch.sh

      # PR #24 was already merged at the verified v18 master commit, but the
      # previous cleanup regex omitted its exact head. Repair that omission
      # without ever deleting an unreviewed or concurrently updated ref.
      - name: Verify previously merged v18 branch for guarded cleanup
        id: verify_v18
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const target = 'fix/naari-optical-poll-and-vitals-events-v18';
            const expectedHead = '0e73b56d54a21ab7aaa79d2178bdaf11a9c9a814';
            const expectedMergeCommit = '10bd1c0defed3bc191257782130bb84de5aa1a46';
            if (defaultBranch !== 'master') {
              throw new Error('Never run the v18 backfill on a non-master default.');
            }
            const { data: base } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${defaultBranch}`
            });
            if (base.object.sha !== context.sha) {
              throw new Error('Protected master moved since this passing CI run.');
            }
            let head;
            try {
              ({ data: head } = await github.rest.git.getRef({
                owner, repo, ref: `heads/${target}`
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info('Old v18 branch already absent; no deletion necessary.');
                return '';
              }
              throw error;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: 24
            });
            if (!pr.merged_at || pr.merge_commit_sha !== expectedMergeCommit ||
                pr.base.ref !== defaultBranch ||
                pr.head.repo?.full_name !== `${owner}/${repo}` ||
                pr.head.ref !== target || pr.head.sha !== expectedHead ||
                head.object.sha !== expectedHead) {
              throw new Error('v18 PR identity/head changed; preserve branch.');
            }
            const { data: contained } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${expectedHead}...${base.object.sha}`
            });
            if (!['ahead', 'identical'].includes(contained.status) ||
                contained.behind_by !== 0) {
              throw new Error('v18 repair head is not fully contained in master.');
            }
            const { data: mergeContained } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${expectedMergeCommit}...${base.object.sha}`
            });
            if (!['ahead', 'identical'].includes(mergeContained.status) ||
                mergeContained.behind_by !== 0) {
              throw new Error('v18 merge commit is not an ancestor of master.');
            }
            core.setOutput('branch', target);
            return expectedHead;

      - name: Delete verified previously merged v18 head with atomic lease
        if: steps.verify_v18.outputs.result != ''
        env:
          REPAIR_BRANCH: ${{ steps.verify_v18.outputs.branch }}
          REPAIR_HEAD: ${{ steps.verify_v18.outputs.result }}
        run: bash .github/scripts/delete-verified-repair-branch.sh

      - name: Delete fully merged legacy NAARI evidence branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const legacyBranch = 'docs/naari-v6-release-evidence';
            const legacyPrNumber = 11;

            const { data: base } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${defaultBranch}`
            });
            if (base.object.sha !== context.sha) {
              throw new Error('Default branch moved; refuse legacy cleanup.');
            }

            let legacy;
            try {
              ({ data: legacy } = await github.rest.git.getRef({
                owner, repo, ref: `heads/${legacyBranch}`
              }));
            } catch (error) {
              if (error.status === 404) {
                core.info('Legacy NAARI evidence branch already deleted.');
                return;
              }
              throw error;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: legacyPrNumber
            });
            if (!pr.merged_at ||
                pr.base.ref !== defaultBranch ||
                pr.head.ref !== legacyBranch ||
                pr.head.repo?.full_name !== `${owner}/${repo}`) {
              throw new Error('Legacy branch does not match the expected merged PR #11; preserve it.');
            }
            if (legacy.object.sha !== pr.head.sha) {
              throw new Error('Legacy branch moved since PR #11; preserve new work.');
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${legacy.object.sha}...${base.object.sha}`
            });
            if (!['ahead', 'identical'].includes(comparison.status) || comparison.behind_by !== 0) {
              throw new Error('Legacy branch is not fully contained in verified master; preserve it.');
            }

            await github.rest.git.deleteRef({
              owner, repo, ref: `heads/${legacyBranch}`
            });
            core.info(`Deleted fully merged legacy branch ${legacyBranch} at ${legacy.object.sha}.`);

      - name: Assert master is the only protected branch after cleanup
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            if (defaultBranch !== 'master') {
              throw new Error('Expected master as the sole official branch.');
            }
            const { data: base } = await github.rest.git.getRef({
              owner, repo, ref: 'heads/master'
            });
            if (base.object.sha !== context.sha) {
              throw new Error('Master moved after tests; inventory cannot close.');
            }
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            if (branches.length !== 1 ||
                branches[0].name !== 'master' ||
                branches[0].protected !== true) {
              throw new Error('Expected only protected master; found: ' +
                branches.map(b => `${b.name} (protected=${b.protected})`).join(', '));
            }
            core.info('PASS: master is protected and is the ONLY branch.');

