name: NAARI KAVACH Optical Ready Autofix

on:
  push:
    branches:
      - "fix/naari-kavach-optical-ready"
    paths:
      - "scripts/apply_naari_optical_ready_fix.py"
      - ".github/workflows/naari-kavach-optical-autofix.yml"

permissions:
  contents: write

jobs:
  apply-repair:
    name: Apply exact optical READY repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact source transformation
        run: python3 scripts/apply_naari_optical_ready_fix.py

      - name: Reject malformed patch
        run: git diff --check

      - name: Commit repaired firmware
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- esp32-firmware/naari_kavach_dual_sensor_ble_test/naari_kavach_dual_sensor_ble_test.ino; then
            echo "No firmware change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add esp32-firmware/naari_kavach_dual_sensor_ble_test/naari_kavach_dual_sensor_ble_test.ino
          git commit -m "fix: harden MAX3010x READY handshake"
          git push origin HEAD:${{ github.ref_name }}
